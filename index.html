<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Ball Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 300px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Bouncing Ball */
    .ball {
      width: 50px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      animation: portalBounce 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    /* Portal Ground */
    .portal {
      width: 100px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #a855f7 0%, #6366f1 40%, transparent 70%);
      border: 2px solid #c084fc;
      box-shadow: 0 0 20px #a855f7, inset 0 0 15px #6366f1;
      margin-top: 10px;
      animation: portalPulse 2s ease-in-out infinite;
    }

    /* Keyframe Animations */
    @keyframes portalBounce {
      0% {
        transform: translateY(-300px) scale(1, 1);
        background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      45% {
        /* Falling stretch */
        transform: translateY(-20px) scale(0.8, 1.2);
      }
      50% {
        /* Squish at impact */
        transform: translateY(0) scale(1.3, 0.6);
        background: radial-gradient(circle at 30% 30%, #f43f5e, #be123c);
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
      }
      55% {
        /* Disappear into portal */
        transform: translateY(15px) scale(0.2, 0.8);
        opacity: 0;
      }
      56%, 100% {
        transform: translateY(-300px) scale(1, 1);
        opacity: 0;
      }
    }

    @keyframes portalPulse {
      0%, 100% {
        transform: scale(0.9);
        box-shadow: 0 0 15px #a855f7, inset 0 0 10px #6366f1;
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 0 30px #f43f5e, inset 0 0 20px #a855f7;
      }
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="ball"></div>
    <div class="portal"></div>
  </div>

</nav>

</html>
